spring.application.name=market-service
server.port=8082
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-market:5432/marketdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:market_svc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:market_svc}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
