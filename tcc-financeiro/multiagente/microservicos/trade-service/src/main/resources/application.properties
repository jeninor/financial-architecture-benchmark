spring.application.name=trade-service
server.port=8083
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-trade:5432/tradedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trade_svc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trade_svc}
spring.jpa.hibernate.ddl-auto=update
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
