spring:

  application:
    name: trade-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://trade-postgres:5432/trade_db}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:finance}

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:

      hibernate:
        format_sql: true


server:

  port: 8083


eureka:

  client:

    initial-instance-info-replication-interval-seconds: 1

    instance-info-replication-interval-seconds: 2

    registry-fetch-interval-seconds: 2

    service-url:

      defaultZone:
        ${EUREKA_SERVER_URL:http://discovery-server:8761/eureka/}

  instance:

    prefer-ip-address: true

    lease-renewal-interval-in-seconds: 2

    lease-expiration-duration-in-seconds: 10


management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info