spring:

  application:
    name: discovery-server


server:

  port: 8761


eureka:

  client:

    register-with-eureka: false

    fetch-registry: false

  server:

    enable-self-preservation: false

    use-read-only-response-cache: false

    response-cache-update-interval-ms: 1000


management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info