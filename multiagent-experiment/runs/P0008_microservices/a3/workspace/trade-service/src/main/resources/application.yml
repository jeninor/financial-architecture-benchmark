spring:

  cloud:
    loadbalancer:
      cache:
        enabled: false

  application:
    name: trade-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://trade-postgres:5432/trade_db}
    username: ${SPRING_DATASOURCE_USERNAME:finance}
    password: ${SPRING_DATASOURCE_PASSWORD:finance}

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:

      hibernate:
        format_sql: true


server:

  port: 8083


eureka:

  client:

    registry-fetch-interval-seconds: 3

    service-url:

      defaultZone:
        ${EUREKA_SERVER_URL:http://discovery-server:8761/eureka/}

  instance:

    lease-renewal-interval-in-seconds: 3


    prefer-ip-address: true


management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info