spring:

  cloud:
    loadbalancer:
      cache:
        enabled: false

  application:
    name: market-service


server:

  port: 8082


eureka:

  client:

    registry-fetch-interval-seconds: 3

    service-url:

      defaultZone:
        ${EUREKA_SERVER_URL:http://discovery-server:8761/eureka/}


  instance:

    lease-renewal-interval-in-seconds: 3


    prefer-ip-address: true


management:

  endpoints:

    web:

      exposure:

        include:
          - health
          - info